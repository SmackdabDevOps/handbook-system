# ============================================================================
# API CONTRACT GENERATOR - AGENT INSTRUCTIONS
# Version: 1.0.0 - {PROJECT_NAME} Template (Updated 2025-11-04)
# Purpose: Generate OpenAPI contracts for {PROJECT_NAME} microservice API
# Changes: Adapted from organization template for {PROJECT_NAME} standalone microservice
# ============================================================================

# ============================================================================
# SECTION 1: AGENT INSTRUCTIONS - READ THIS FIRST
# ============================================================================
#
# TO THE AGENT: You are building an API contract for {PROJECT_NAME} - an enterprise
# microservice with specific business domains and real-time functionality.
# This template provides everything you need to generate a compatible API.
#
# ═══════════════════════════════════════════════════════════════════════════
# MANDATORY RULES - MUST FOLLOW
# ═══════════════════════════════════════════════════════════════════════════
#
# 1. AUTHENTICATION:
#    ✓ USE: CookieAuth (X-Session) for web applications
#    ✓ USE: HeaderAuth (Authorization) for mobile applications
#    ✗ NEVER: OAuth2, BearerAuth, JWT tokens in contract
#    → Sessions are managed server-side
#
# 2. MULTI-TENANCY:
#    ✓ Organization ID, Branch ID, and Workspace ID are derived from session data
#    ✓ Client authenticates with session cookie/header (NEVER sends tenant IDs)
#    ✓ Server extracts organization_id, branch_id, workspace_id from Redis session
#    ✗ DO NOT include X-Organization-ID, X-Branch-ID, or X-Workspace-ID headers
#    → All tenant context is handled internally by the server
#
# 3. RESPONSE FORMAT:
#    ✓ USE: ResponseEnvelope schema for ALL responses
#    ✗ NEVER: RFC 7807 Problem Details, custom error formats
#    → Structure: { data, message, toast, responseType } with HTTP status code on the response line
#
# 4. BULK OPERATIONS:
#    ✓ POST endpoints accept arrays via { items: [...] } format
#    ✗ NEVER create separate /bulk endpoints
#    → Same endpoint handles single or multiple records
#    → Most operations process immediately (no automatic queuing)
#    → Background jobs used for async operations (exports, GDPR)
#
# 5. QUEUE SYSTEM:
#    ✓ Apache Pulsar for all async operations
#    → Used for: notifications, GDPR exports, background jobs
#    → Not used for: real-time messaging (Socket.IO handles that)
#
# 6. DATA PATTERNS:
#    ✓ All schemas are STATIC (no dynamic field_id pattern)
#    ✓ Use UUID v7 (lowercase) for all primary keys
#
# 7. NAMING CONVENTIONS:
#    ✓ Path parameters: camelCase (e.g., {channelId}, {userId}, {messageId})
#    ✓ Query parameters: snake_case (e.g., ?workspace_id=...&include_archived=true)
#    ✓ Request body fields: snake_case (e.g., workspace_id, channel_type, who_can_post)
#    ✓ Response body fields: snake_case (e.g., created_at, is_archived, member_ids)
#    ✗ NEVER: Mix conventions in the same context
#    ✗ NEVER: Use camelCase for body/query fields (e.g., workspaceId, channelType)
#    → See handbook/contracts/NAMING_CONVENTIONS.md for complete rules
#    → Enforced by: npm run validate:naming
#
# ═══════════════════════════════════════════════════════════════════════════
# API PATH STRUCTURE GUIDE
# ═══════════════════════════════════════════════════════════════════════════
#
# {PROJECT_NAME} has a SINGLE unified API for all clients:
#
# → PATH PREFIX OPTIONS:
#   1. /chat/{resource}     - When deployed alongside other services
#   2. /{resource}          - When deployed as standalone service
#
# → USED BY:
#   - Web frontend (React/Next.js)
#   - Mobile applications (iOS/Android)
#   - Admin tools
#
# → FEATURES:
#   - Session-based authentication (Cookie or Header)
#   - Real-time updates via Socket.IO
#   - Full CRUD operations
#   - File uploads to Wasabi S3
#
# NOTE: No version numbers in paths - versioning handled at infrastructure level
#
# ═══════════════════════════════════════════════════════════════════════════
# BULK OPERATIONS ARCHITECTURE
# ═══════════════════════════════════════════════════════════════════════════
#
# {PROJECT_NAME} uses simple bulk operations - NO separate /bulk endpoints:
#
# IMPLEMENTATION PATTERN:
# 1. POST endpoints accept { items: [...] } array format
# 2. Each item in array is processed in a transaction
# 3. Most operations complete immediately (no threshold-based queuing)
#
# REQUEST FORMAT:
# - Standardized format: { items: [{ ...fields }, { ...fields }] }
# - Single record: { items: [{ name: "general" }] }
# - Multiple records: { items: [{ name: "general" }, { name: "random" }] }
#
# RESPONSE PATTERNS:
# - Immediate processing: 200 status, toast: false
# - Async jobs (GDPR, exports): 201 status, toast: true, includes job_id
#
# EXAMPLES:
# - Create channels: POST /chat/channels with { items: [{ name: "general", type: "public_channel" }] }
# - Add members: POST /chat/channels/{id}/members with { items: [{ userId: "..." }] }
#
# ═══════════════════════════════════════════════════════════════════════════
# STANDARD PATTERNS TO FOLLOW
# ═══════════════════════════════════════════════════════════════════════════
#
# NAMING EXAMPLES:
# CORRECT:
#   Path: /channels/{channelId}/members/{userId}
#   Body: { "workspace_id": "...", "who_can_post": "admins", "allow_file_uploads": true }
#   Query: ?workspace_id=...&include_deleted=true
#
# WRONG:
#   Path: /channels/{channel_id}/members/{user_id}  # snake_case in path
#   Body: { "workspaceId": "...", "whoCanPost": "..." }  # camelCase in body
#
# PAGINATION:
# - Use cursor-based: after_key, before_key, limit
# - NOT offset-based (doesn't scale well with large datasets)
#
# FIELD SELECTION:
# - Support: ?fields=id,name,created_at
# - Support: ?exclude=sensitive_field
#
# FILTERING:
# - Static schemas: ?filters[column_name]=value
# - Type-aware: strings use ILIKE, numbers exact match, arrays use IN
# - Example: ?filters[type]=public_channel&filters[is_archived]=false
#
# SOFT DELETE:
# - DELETE performs soft delete by default
# - ?hard_delete=true for permanent deletion
# - ?include_deleted=true to include soft-deleted items in GET
#
# PERMISSIONS:
# - Required permissions documented via x-required-permissions extension
# - Server enforces permissions from authenticated session
# - DO NOT include "signature" field in request bodies
# - Module is always "{module_name}" for all {PROJECT_NAME} endpoints
# - Example: x-required-permissions: { module: "chat", actions: ["create", "update"] }
#
# MESSAGE CONTENT LIMITS:
# - Message content: 5,000 character maximum (minLength: 1, maxLength: 5000)
# - Emoji format: Unicode characters (e.g., "👍") NOT shortcodes
# - File uploads: 50MB maximum per file, 10 files max per message
#
# PASTE-TO-FILE CONVERSION (Frontend Responsibility):
# - When user types: Frontend stops at 5,000 chars (truncate)
# - When user pastes > 5,000 chars: Frontend auto-converts to .txt file
#   1. Create file using Blob API
#   2. Upload via POST /files/upload
#   3. Send message with file_ids array and preview text
# - Backend rejects content > 5,000 with 400 error and helpful message
# - See architecture/backend/01-backend-technical-design.md section 6.5
#
# ============================================================================
# SECTION 2: OPENAPI CONTRACT TEMPLATE - COPY AND MODIFY THIS
# ============================================================================

openapi: 3.0.3

info:
  title: {Your API Title} # REPLACE: e.g., "{PROJECT_NAME} Channels API"
  description: |
    {Your API description}

    ## Overview
    {Brief description of what this API does}

    ## Authentication
    This API uses session-based authentication via cookies (web) or header tokens (mobile).

    ## Multi-tenancy
    All operations are scoped to organization, branch, and workspace level.
    Organization ID, Branch ID, and Workspace ID are derived from session data stored in Redis.

    ## Real-Time Updates
    Message delivery and presence updates use Socket.IO (WebSocket).
    See Socket.IO event documentation for real-time capabilities.

  version: 1.0.0
  contact:
    name: {PROJECT_NAME} API Support
    email: api-support@yourdomain.com

servers:
  - url: https://api.yourdomain.com/chat
    description: Production (via API Gateway)
  - url: https://staging-api.yourdomain.com/chat
    description: Staging
  - url: http://localhost:8001
    description: Local development

# ============================================================================
# SECURITY SCHEMES - DO NOT MODIFY
# ============================================================================
security:
  - CookieAuth: []
  - HeaderAuth: []

# ============================================================================
# PATHS - YOUR API ENDPOINTS GO HERE
# ============================================================================
paths:
  # Path structure for {PROJECT_NAME}:
  # - Use /{module}/{resource} prefix when deployed with API Gateway
  # - Or just /{resource} when standalone
  # - NO version numbers in paths

  /chat/{resources}:  # REPLACE with your actual path pattern (e.g., /chat/channels)
    get:
      summary: List {resources}
      x-required-permissions:
        module: chat
        actions: [read]
      operationId: list{Resources}
      tags:
        - {Resource}
      parameters:
        - $ref: '#/components/parameters/AfterKey'
        - $ref: '#/components/parameters/BeforeKey'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Exclude'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    
    post:
      summary: Create {resource}(s)
      description: |
        Creates one or more {resources}.
        Uses standardized items array format for both single and bulk operations.
        Most operations complete immediately and return HTTP 200 with toast: false.
      x-required-permissions:
        module: chat
        actions: [create]
      operationId: create{Resources}
      tags:
        - {Resource}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/{Resource}'
                  minItems: 1
                  maxItems: 1000
                  description: Array of records to create (single or multiple)
      responses:
        '200':
          description: Created successfully (processed immediately)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelope'
        '201':
          description: Accepted for async processing (for GDPR exports, admin operations)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /chat/{resources}/{id}:  # REPLACE with your actual path pattern
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    
    get:
      summary: Get {resource} by ID
      x-required-permissions:
        module: chat
        actions: [read]
      operationId: get{Resource}
      tags:
        - {Resource}
      parameters:
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Exclude'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    
    put:
      summary: Update {resource}
      x-required-permissions:
        module: chat
        actions: [update]
      operationId: update{Resource}
      tags:
        - {Resource}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/{Resource}'
      responses:
        '200':
          description: Updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    
    delete:
      summary: Delete {resource}
      description: Performs soft delete by default. Use ?hard_delete=true for permanent deletion.
      x-required-permissions:
        module: chat
        actions: [delete]
      operationId: delete{Resource}
      tags:
        - {Resource}
      parameters:
        - name: hard_delete
          in: query
          schema:
            type: boolean
            default: false
          description: Permanently delete instead of soft delete
      responses:
        '200':
          description: Deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

# ============================================================================
# COMPONENTS - REUSABLE SCHEMAS AND PARAMETERS
# ============================================================================
components:
  # ══════════════════════════════════════════════════════════════════════════
  # SECURITY SCHEMES - MANDATORY, DO NOT CHANGE
  # ══════════════════════════════════════════════════════════════════════════
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: X-Session
      description: Web application authentication via session cookie
    
    HeaderAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Mobile application authentication via header token
  
  # ══════════════════════════════════════════════════════════════════════════
  # PARAMETERS - STANDARD PARAMETERS FOR ALL APIS
  # ══════════════════════════════════════════════════════════════════════════
  parameters:
    # Note: Organization ID, Branch ID, and Workspace ID are derived from session data
    # They should NOT be passed as headers from the client
    
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        description: Lowercase UUID v7 identifier
      description: Resource identifier (new inventory tables must follow UUID v7 format)
    
    AfterKey:
      name: after_key
      in: query
      schema:
        type: string
      description: Cursor for forward pagination
    
    BeforeKey:
      name: before_key
      in: query
      schema:
        type: string
      description: Cursor for backward pagination
    
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Maximum items per page
    
    Sort:
      name: sort
      in: query
      schema:
        type: string
        pattern: '^-?[a-zA-Z_]+$'
      description: Sort field with optional - prefix for descending
    
    Filters:
      name: filters
      in: query
      schema:
        type: object
        additionalProperties: true
      style: deepObject
      explode: true
      description: |
        Field-based filtering using column names.
        Type-aware: strings use ILIKE, numbers exact match, arrays use IN.
        Example: filters[type]=public_channel&filters[is_archived]=false
    
    Fields:
      name: fields
      in: query
      schema:
        type: string
      description: Comma-separated list of fields to include
    
    Exclude:
      name: exclude
      in: query
      schema:
        type: string
      description: Comma-separated list of fields to exclude
  
  # ══════════════════════════════════════════════════════════════════════════
  # SCHEMAS - STANDARD RESPONSE FORMATS
  # ══════════════════════════════════════════════════════════════════════════
  schemas:
    # MANDATORY: All responses must use this envelope
    # NOTE: The actual implementation uses JSONBig.parse(JSONBig.stringify(data))
    #       for the data field to handle BigInt serialization
    ResponseEnvelope:
      type: object
      required:
        - data
        - responseType
      properties:
        data:
          description: Response payload (null for errors). Server uses JSONBig for BigInt support
        message:
          type: string
          description: Success or error message
          nullable: true
        toast:
          type: boolean
          default: false
          description: Whether to show toast notification (true for queued bulk operations)
        responseType:
          type: string
          enum: [success, error]
          description: Response status indicator
    
    PaginatedResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  description: Array of resources
                pagination:
                  $ref: '#/components/schemas/PaginationMeta'
    
    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          description: Total number of items
        limit:
          type: integer
          description: Items per page
        hasMore:
          type: boolean
          description: Whether more items exist
        nextCursor:
          type: string
          nullable: true
          description: Cursor for next page
        prevCursor:
          type: string
          nullable: true
          description: Cursor for previous page
    
    AsyncJobResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          description: Used when operations are queued; set ResponseEnvelope.toast to true.
          properties:
            data:
              type: object
              properties:
                job_id:
                  type: string
                  format: uuid
                  description: Job tracking ID
                status_url:
                  type: string
                  format: uri
                  description: URL to check job status
                estimated_completion:
                  type: string
                  format: date-time
                  description: Estimated completion time
    
    # ════════════════════════════════════════════════════════════════════════
    # YOUR RESOURCE SCHEMAS GO HERE
    # ════════════════════════════════════════════════════════════════════════
    {Resource}:  # REPLACE with your actual resource schema (e.g., Channel, Message)
      type: object
      required:
        - name  # Example required field
      properties:
        id:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          description: Lowercase UUID v7 identifier
          readOnly: true
        organization_id:
          type: integer
          format: int64
          readOnly: true
          description: Auto-populated from session
        branch_id:
          type: integer
          format: int64
          readOnly: true
          nullable: true
          description: Auto-populated from session (optional)
        workspace_id:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          description: Workspace UUID v7, auto-populated from session
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Resource name
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Soft delete timestamp
  
  # ══════════════════════════════════════════════════════════════════════════
  # RESPONSES - STANDARD ERROR RESPONSES
  # ══════════════════════════════════════════════════════════════════════════
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseEnvelope'
          example:
            data: null
            message: "Invalid request parameters"
            toast: false
            responseType: error
    
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseEnvelope'
          example:
            data: null
            message: "Authentication required"
            toast: true
            responseType: error
    
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseEnvelope'
          example:
            data: null
            message: "Insufficient permissions"
            toast: true
            responseType: error
    
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseEnvelope'
          example:
            data: null
            message: "Resource not found"
            toast: false
            responseType: error
    
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseEnvelope'
          example:
            data:
              errors:
                field_name: "Field is required"
            message: "Validation failed"
            toast: true
            responseType: error
    
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseEnvelope'
          example:
            data: null
            message: "An unexpected error occurred"
            toast: true
            responseType: error

